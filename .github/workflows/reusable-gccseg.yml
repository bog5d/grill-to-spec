name: Reusable SCP v3.8 Contract Gate
on:
  workflow_call:
    inputs:
      contract_path:
        description: "GCCSEG contract JSON in caller repository"
        required: true
        type: string
jobs:
  gccseg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          path: project
      - name: Checkout SCP policy at reviewed release commit
        uses: actions/checkout@v4
        with:
          repository: bog5d/grill-to-spec
          ref: 49e05357a7e6aa6190283a47a9215b17615049d6
          path: policy
      - name: Validate GCCSEG structure
        run: python policy/scripts/check_gccseg.py --require-v3-8 "project/${{ inputs.contract_path }}"
